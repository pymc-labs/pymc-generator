# NEW independent varying-baseline worlds, NOT historically matched TV intervention.
[study]
worlds = 2
seed = 20319
baseline = "varying"
reported_weeks = [0, 31]
score_weeks = [7, 31]
burn_in = 8

[generator]
prior_file = "example_varying_prior.json"  # complete explicit SCMPrior, TOML-relative

[methods]
enabled = ["advi", "mcmc"]  # bounded OLS on varying baseline is rejected

[methods.advi]
steps = 500
draws = 40
seeds = [4701, 4702]

[methods.mcmc]
chains = 2
warmup = 100
draws = 100
seed = 5801
target_accept = 0.9
maxdepth = 8
sampler = "nutpie"
adaptation = "draw_diag"

[score]
relative = 0.10
absolute = 0.01

[diagnostics]
rhat = 1.01
ess = 400
bfmi = 0.3
divergences = 0
maxdepth_hits = 0
