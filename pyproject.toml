[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-generator"
version = "0.0.1"
description = "Simulate thousands of synthetic MMM worlds with exact causal decompositions — human-readable dataset bundles and PFN-ready corpora. Built on PyTensor / PyMC / pymc-marketing."
# pymc 6.0.1 (the pinned modeling stack) requires Python >= 3.12.
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "PyMC Labs"},
    {name = "Carlos Trujillo"},
]
readme = "README.md"
keywords = ["marketing-mix-model", "synthetic-data", "structural-causal-models", "simulation", "prior-predictive", "pytensor", "bayesian", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    # Validated modeling stack (matches pymc-labs/structural-pfn's canonical
    # env). The generator builds the SCM as a pytensor/pymc graph and draws
    # from it, using pymc-marketing's adstock/saturation transformers.
    # pymc-marketing 1.0 is not on PyPI yet, so it is installed by git URL,
    # pinned to the exact tested COMMIT (the `v1.0.0` ref is a mutable branch,
    # not a tag — pinning it would make installs non-reproducible and could
    # break CI when the branch advances). Bump this SHA deliberately, and swap
    # to "pymc-marketing>=1.0.0" once a PyPI release exists. (A git-URL dep also
    # blocks PyPI upload of this package until then — fine, we install from git.)
    "pytensor==3.0.7",
    "pymc==6.0.1",
    "pymc-marketing @ git+https://github.com/pymc-labs/pymc-marketing.git@ff70aae62dea1933b758a55885c24a76a3e7a9a5",
    "scipy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # Pinned so local, pre-commit, and CI formatting agree; keep in sync
    # with .github/workflows/ci.yml and .pre-commit-config.yaml.
    "ruff==0.15.18",
    "mypy",
    "pre-commit",
]
docs = [
    # MkDocs Material site with docstring-driven API pages (mkdocstrings),
    # executable code blocks that render plots inline (markdown-exec), and the
    # examples notebook executed at build time (mkdocs-jupyter). The notebook
    # runs in a registered Jupyter kernel named "prior-generator" — register it
    # once with `python -m ipykernel install --user --name prior-generator`.
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.6",
    "markdown-exec>=1.12.3",
    "mkdocs-jupyter>=0.26.3",
    "pymdown-extensions>=11.0.1",
    # Python bindings; the system Graphviz executable is installed separately.
    "graphviz>=0.20",
    "nbformat>=5.10.4",
    "ipykernel>=7.3.0",
]

[project.scripts]
prior-generator = "prior_generator.cli:main"

[tool.setuptools.packages.find]
include = ["prior_generator*"]

[project.urls]
Homepage = "https://github.com/pymc-labs/prior-generator"
Repository = "https://github.com/pymc-labs/prior-generator.git"
Issues = "https://github.com/pymc-labs/prior-generator/issues"
Changelog = "https://github.com/pymc-labs/prior-generator/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "slow: marks tests as slow (>5s; large-N statistical). Gated by --runslow.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase (allow K_max_effective etc.)
    "N803",   # argument name should be lowercase (allow X, Y for data)
    "N806",   # variable in function should be lowercase (allow X, Y)
    "B007",   # loop control variable not used (common in graph setup)
    "B904",   # raise from err (acceptable for optional-dependency re-raise)
    "B905",   # zip strict (not a correctness bug)
]

[tool.ruff.lint.per-file-ignores]
# Notebook narratives introduce imports at the point where they are explained.
"docs/examples/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["prior_generator"]

[tool.mypy]
# No pinned python_version: check at the running interpreter so modern stub
# syntax (e.g. numpy's PEP 695 `type` statements) parses. The 3.12 floor
# (requires-python) is guarded by the CI test matrix and ruff's target-version.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "pytensor.*",
    "pymc.*",
    "pymc_marketing.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# Type-error backlog inherited from the structural-pfn extraction (these
# modules were mypy-grandfathered there too). MyPy is BLOCKING in CI; these
# modules are grandfathered with ignore_errors until each is burned down.
# Do NOT add new modules here — new code must type-check clean. Remove a
# module from this list once its errors are fixed.
[[tool.mypy.overrides]]
module = [
    "prior_generator.data_generator",
    "prior_generator.mechanisms",
    "prior_generator.sampler",
]
ignore_errors = true
