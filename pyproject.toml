[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymc-generator"
dynamic = ["version"]
description = "Generate structural causal models as PyTensor / PyMC graphs with exact causal decompositions — human-readable dataset bundles and stacked tensor corpora."
# Supported interpreter floor; CI exercises Python 3.13 and 3.14.
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "PyMC Labs"},
    {name = "Carlos Trujillo"},
]
readme = "README.md"
keywords = ["structural-causal-models", "causal-inference", "synthetic-data", "simulation", "prior-predictive", "marketing-mix-model", "pytensor", "bayesian", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    # Released packages keep registry installs possible. uv.lock records the
    # validated numerical stack; dependency upgrades require fresh evidence.
    "pytensor>=3.2.3,<4",
    "pymc>=6.2,<7",
    "pymc-marketing>=1.1,<2",
    "scipy",
    "pandas",
    "matplotlib",
    # mechanisms.py imports pytensor.xtensor, whose type module imports xarray
    # at module level. xarray is not a core pytensor requirement, so declare it
    # here rather than relying on pymc-marketing pulling it in transitively.
    "xarray",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # Pinned so local, pre-commit, and CI formatting agree; keep in sync
    # with .github/workflows/ci.yml and .pre-commit-config.yaml.
    "ruff==0.15.18",
    "mypy",
    "pre-commit",
]
docs = [
    # MkDocs Material site with docstring-driven API pages (mkdocstrings),
    # executable code blocks that render plots inline (markdown-exec), and the
    # examples notebook executed at build time (mkdocs-jupyter). The notebook
    # runs in a registered Jupyter kernel named "pymc-generator" — register it
    # once with `python -m ipykernel install --user --name pymc-generator`.
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.6",
    "markdown-exec>=1.12.3",
    "mkdocs-jupyter>=0.26.3",
    "pymdown-extensions>=11.0.1",
    # Python bindings; the system Graphviz executable is installed separately.
    "graphviz>=0.20",
    "nbformat>=5.10.4",
    "ipykernel>=7.3.0",
]

[dependency-groups]
build = ["build", "twine", "setuptools>=77", "wheel"]

[tool.uv]
required-version = ">=0.9.10"
cache-keys = [{file = "pyproject.toml"}, {file = "pymc_generator/_version.py"}]

[project.scripts]
pymc-generator = "pymc_generator.cli:main"

[tool.setuptools.packages.find]
include = ["pymc_generator*"]

[tool.setuptools.package-data]
pymc_generator = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "pymc_generator._version.__version__"}

[project.urls]
Homepage = "https://github.com/pymc-labs/pymc-generator"
Repository = "https://github.com/pymc-labs/pymc-generator.git"
Issues = "https://github.com/pymc-labs/pymc-generator/issues"
Changelog = "https://github.com/pymc-labs/pymc-generator/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "slow: marks tests as slow (>5s; large-N statistical). Gated by --runslow.",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N803",   # argument name should be lowercase (allow X, Y for data)
    "N806",   # variable in function should be lowercase (allow X, Y)
    "B007",   # loop control variable not used (common in graph setup)
    "B904",   # raise from err (acceptable for optional-dependency re-raise)
    "B905",   # zip strict (not a correctness bug)
]

[tool.ruff.lint.per-file-ignores]
# Notebook narratives introduce imports at the point where they are explained.
"docs/examples/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pymc_generator"]

[tool.mypy]
# No pinned python_version: check at the running interpreter so modern stub
# syntax (e.g. numpy's PEP 695 `type` statements) parses. The 3.13 floor
# (requires-python) is guarded by the CI test matrix and ruff's target-version.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "pytensor.*",
    "pymc.*",
    "pymc_marketing.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true

