name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      # The docs execute real code (markdown-exec blocks + the examples
      # notebook), so we need the full modeling stack — an editable install
      # pulls it from [project.dependencies], including the git-URL
      # pymc-marketing — plus the [docs] extra.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # mkdocs-jupyter executes the notebook in this named kernel.
      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name prior-generator

      - name: Build site
        run: mkdocs build --clean --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only deploy from main; PRs just build (above) to catch breakage.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
