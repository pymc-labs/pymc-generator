name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run Ruff linter
        run: uv run --no-sync ruff check .
      - name: Run Ruff formatter check
        run: uv run --no-sync ruff format --check .
      - name: Run mypy
        run: uv run --no-sync mypy pymc_generator --no-error-summary

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run --no-sync pytest tests/ --cov=pymc_generator --cov-report=xml --cov-report=term-missing

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run gated statistical tests
        run: uv run --no-sync pytest tests/ --runslow -m slow

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, slow-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked build tools
        run: uv sync --locked --group build
      - name: Build and inspect distributions
        run: |
          uv run --no-sync python -m build --no-isolation
          uv run --no-sync twine check dist/*
      - name: Exercise wheel with locked runtime dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/wheel-smoke" uv sync --frozen --no-install-project
          uv pip install --python "${RUNNER_TEMP}/wheel-smoke/bin/python" --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -I scripts/smoke_install.py
          "${RUNNER_TEMP}/wheel-smoke/bin/pymc-generator" --help
      - name: Exercise the self-contained source archive
        run: |
          mkdir "$RUNNER_TEMP/source-smoke"
          tar -xf dist/pymc_generator-*.tar.gz -C "$RUNNER_TEMP/source-smoke"
          cd "$RUNNER_TEMP/source-smoke"/pymc_generator-*
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/source-environment"
          uv sync --locked --extra dev --extra docs
          uv run --no-sync pytest tests/ --collect-only --runslow -q
          uv run --no-sync python -I scripts/smoke_install.py
          uv run --no-sync python - <<'PY'
          import runpy
          import pymc_generator as pg
          from mkdocs.config import load_config

          load_config("mkdocs.yml")
          hooks = runpy.run_path("mkdocs_hooks.py")
          hooks["on_page_markdown"]("")
          import scm_docs

          errors = pg.DataGenerator.validate_corpus(scm_docs.corpus())
          if errors:
              raise SystemExit("\n".join(errors))
          print("Source documentation example passes")
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  native-conda:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SOLVER: libmamba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4
        with:
          # 26.1.1-0 and -1 have no installer assets; retain conda 26.1.1.
          miniforge-version: "26.1.1-3"
          environment-file: conda/build-environment.yml
          activate-environment: pymc-generator-build
          auto-activate: false
          channel-priority: strict
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Build native package from the verified source archive
        run: |
          python scripts/build_conda.py dist/pymc_generator-*.tar.gz \
            --conda "$CONDA_PREFIX/bin/conda"
      - name: Exercise the completed native channel
        run: |
          "$CONDA_PREFIX/bin/conda" create --prefix "$RUNNER_TEMP/native-smoke" \
            --override-channels --strict-channel-priority \
            --channel "file://$PWD/dist/conda-channel" --channel conda-forge \
            "python=3.13" pymc-generator --yes
          "$CONDA_PREFIX/bin/conda" run --prefix "$RUNNER_TEMP/native-smoke" \
            python -I scripts/smoke_install.py
          "$CONDA_PREFIX/bin/conda" run --prefix "$RUNNER_TEMP/native-smoke" \
            pymc-generator --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-conda
          path: dist/conda-channel/
          if-no-files-found: error
