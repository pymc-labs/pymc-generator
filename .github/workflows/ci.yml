name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Keep in sync with .pre-commit-config.yaml and pyproject [dev] extra.
  RUFF_VERSION: "0.15.18"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}" mypy
          pip install -e .[dev]

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run MyPy type checking
        run: mypy prior_generator --no-error-summary

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The pinned modeling stack (pytensor==3.0.7, pymc==6.0.1, and
      # pymc-marketing at an exact commit) comes from [project.dependencies],
      # so an editable install also resolves the git-URL dependency.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: |
          pytest tests/ -v --cov=prior_generator --cov-report=xml --cov-report=term-missing

  # The --runslow gate (tests/conftest.py) skips every @pytest.mark.slow test by
  # default, so the `test` job above NEVER runs them and they can rot unnoticed.
  # This job runs exactly that gated set, with `-m slow` so it does not re-run
  # the ~11-minute fast suite: the 18 slow items take ~1m45s locally, which is
  # why this is a plain required job on every push/PR rather than a nightly
  # schedule. It is listed in `build.needs`, so a broken slow test blocks the
  # pipeline like any other failure. One interpreter (the fast suite covers the
  # 3.12/3.13 matrix) and no coverage upload — these are large-N statistical
  # checks, not new code paths.
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run slow tests
        run: pytest tests/ -q --runslow -m slow

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, slow-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Smoke-install wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import prior_generator; print(prior_generator.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
