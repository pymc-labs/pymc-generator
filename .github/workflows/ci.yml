name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run Ruff linter
        run: uv run --no-sync ruff check .
      - name: Run Ruff formatter check
        run: uv run --no-sync ruff format --check .
      - name: Run mypy
        run: uv run --no-sync mypy prior_generator --no-error-summary

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run --no-sync pytest tests/ --cov=prior_generator --cov-report=xml --cov-report=term-missing

  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Run gated statistical tests
        run: uv run --no-sync pytest tests/ --runslow -m slow

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, slow-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked build tools
        run: uv sync --locked --group build
      - name: Build and inspect distributions
        run: |
          uv run --no-sync python -m build --no-isolation
          uv run --no-sync twine check dist/*
      - name: Exercise wheel with locked runtime dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/wheel-smoke" uv sync --frozen --no-install-project
          uv pip install --python "${RUNNER_TEMP}/wheel-smoke/bin/python" --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -I scripts/smoke_install.py
          "${RUNNER_TEMP}/wheel-smoke/bin/prior-generator" --help
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
