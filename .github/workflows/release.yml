name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.10"
          python-version: "3.13"
      - name: Verify tag matches the public package version
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import os
          from pymc_generator import __version__

          expected = f"v{__version__}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match package version {expected!r}")
          print(f"Verified release tag {actual}")
          PY

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  github-release:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.10"
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-conda
          path: dist/conda-channel
      - name: Verify and assemble release artifacts
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import email.parser
          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheel, = dist.glob("*.whl")
          sdist, = dist.glob("pymc_generator-*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              wheel_metadata = archive.read(f"pymc_generator-{version}.dist-info/METADATA")
          with tarfile.open(sdist) as archive:
              with archive.extractfile(f"pymc_generator-{version}/PKG-INFO") as metadata:
                  sdist_metadata = metadata.read()
          for path, raw in ((wheel, wheel_metadata), (sdist, sdist_metadata)):
              metadata = email.parser.BytesParser().parsebytes(raw)
              if (metadata["Name"], metadata["Version"]) != ("pymc-generator", version):
                  raise SystemExit(f"Unexpected package identity in {path}")

          bundle = dist / "conda-channel.tar.gz"
          with tarfile.open(bundle, "w:gz") as archive:
              archive.add(
                  dist / "conda-channel",
                  arcname="conda-channel",
                  filter=lambda entry: None if ".cache" in Path(entry.name).parts else entry,
              )
          with (dist / "SHA256SUMS").open("w") as checksums:
              for path in (wheel, sdist, bundle):
                  with path.open("rb") as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  checksums.write(f"{digest}  {path.name}\n")
          print((dist / "SHA256SUMS").read_text())
          PY
      - name: Create draft GitHub Release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/pymc_generator-*.tar.gz \
            dist/conda-channel.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"

  pypi-publish:
    # Last and irreversible: a version can never be replaced on PyPI. Runs only
    # after the full CI matrix, the native conda build, and the verified draft
    # GitHub Release, and then waits for the `pypi` environment's reviewers.
    runs-on: ubuntu-latest
    needs: github-release
    environment:
      name: pypi
      url: https://pypi.org/p/pymc-generator
    permissions:
      # Trusted publishing mints a short-lived OIDC token instead of a stored
      # API token. No secret is read by this job.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Refuse to upload anything but this project's wheel and source archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          shopt -s nullglob dotglob
          unexpected=()
          for path in dist/*; do
            case "${path#dist/}" in
              "pymc_generator-${version}-py3-none-any.whl") ;;
              "pymc_generator-${version}.tar.gz") ;;
              *) unexpected+=("$path") ;;
            esac
          done
          if [ "${#unexpected[@]}" -ne 0 ]; then
            printf 'Refusing to publish unexpected artifact: %s\n' "${unexpected[@]}" >&2
            exit 1
          fi
          if [ ! -f "dist/pymc_generator-${version}-py3-none-any.whl" ] \
            || [ ! -f "dist/pymc_generator-${version}.tar.gz" ]; then
            echo "Expected both a wheel and a source archive for ${version}" >&2
            exit 1
          fi
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
