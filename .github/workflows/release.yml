name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
      - name: Verify tag matches the public package version
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import os
          from pymc_generator import __version__

          expected = f"v{__version__}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match package version {expected!r}")
          print(f"Verified release tag {actual}")
          PY

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  github-release:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.10"
          python-version: "3.13"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-conda
          path: dist/conda-channel
      - name: Verify and assemble release artifacts
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import email.parser
          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheel, = dist.glob("*.whl")
          sdist, = dist.glob("pymc_generator-*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              wheel_metadata = archive.read(f"pymc_generator-{version}.dist-info/METADATA")
          with tarfile.open(sdist) as archive:
              with archive.extractfile(f"pymc_generator-{version}/PKG-INFO") as metadata:
                  sdist_metadata = metadata.read()
          for path, raw in ((wheel, wheel_metadata), (sdist, sdist_metadata)):
              metadata = email.parser.BytesParser().parsebytes(raw)
              if (metadata["Name"], metadata["Version"]) != ("pymc-generator", version):
                  raise SystemExit(f"Unexpected package identity in {path}")

          bundle = dist / "conda-channel.tar.gz"
          with tarfile.open(bundle, "w:gz") as archive:
              archive.add(
                  dist / "conda-channel",
                  arcname="conda-channel",
                  filter=lambda entry: None if ".cache" in Path(entry.name).parts else entry,
              )
          with (dist / "SHA256SUMS").open("w") as checksums:
              for path in (wheel, sdist, bundle):
                  with path.open("rb") as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  checksums.write(f"{digest}  {path.name}\n")
          print((dist / "SHA256SUMS").read_text())
          PY
      - name: Create draft GitHub Release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/pymc_generator-*.tar.gz \
            dist/conda-channel.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
