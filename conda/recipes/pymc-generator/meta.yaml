package:
  name: pymc-generator
  version: {{ environ["PYMC_GENERATOR_VERSION"] }}

source:
  url: {{ environ["PYMC_GENERATOR_SDIST"] }}
  sha256: {{ environ["PYMC_GENERATOR_SDIST_SHA256"] }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v
  entry_points:
    - pymc-generator = pymc_generator.cli:main

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    # Mirror pyproject.toml's runtime requirements exactly. Transitive packages
    # (arviz, numba, pydantic, scikit-learn, preliz, pymc-extras) are resolved
    # by pymc/pymc-marketing and are deliberately not re-declared here: exact
    # `==` run pins would make this package uninstallable beside any other
    # conda-forge content and are rejected by conda-forge review. Exact
    # reproduction of the validated stack belongs to uv.lock and to the
    # explicit conda environment export, not to package run constraints.
    - python >=3.13
    - numpy
    - scipy
    - pandas
    - matplotlib-base
    - xarray
    - pytensor >=3.2.3,<4
    - pymc >=6.2,<7
    - pymc-marketing >=1.1,<2

test:
  requires:
    - python {{ python }}.*
    - pip
  source_files:
    - scripts/smoke_install.py
  commands:
    - python -m pip check
    - python -I scripts/smoke_install.py
    - pymc-generator --help

about:
  home: https://github.com/pymc-labs/pymc-generator
  summary: Synthetic MMM worlds with known structural decompositions
  license: MIT
  license_file: LICENSE
