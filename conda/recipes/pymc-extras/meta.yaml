{% set version = "0.12.2.dev1+gee8cc37df" %}

package:
  name: pymc-extras
  version: {{ version }}

source:
  url: https://github.com/pymc-devs/pymc-extras/archive/ee8cc37df25f177ae7aea8a76587fb26da261a80.tar.gz
  sha256: 2ced6d791de6e2e693c4157b4bf813f6bb29c6bd7dcf020fe5eee7940aa1a8a6

build:
  number: 0
  string: ee8cc37_0
  noarch: python
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.12
    - pymc ==6.0.1
    - pytensor ==3.0.7
    - arviz >=1.1
    - better-optimize >=0.4.2,<1
    - pydantic >=2
    - preliz >=0.26,<0.27

test:
  requires:
    - python {{ python }}.*
  imports:
    - pymc_extras

about:
  home: https://github.com/pymc-devs/pymc-extras
  summary: Exact pymc-extras commit used by prior-generator's validated stack
  license: Apache-2.0
  license_file: LICENSE
