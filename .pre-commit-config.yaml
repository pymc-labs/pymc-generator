# Local enforcement of the same gates CI runs. Install once with:
#   uv sync --locked --extra dev && uv run --no-sync pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  # Keep rev in sync with the Ruff pin in pyproject.toml and uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type-check against the real locked modeling environment, not stub-only deps.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy pymc_generator
        language: system
        files: ^pymc_generator/|^pyproject.toml$|^uv.lock$
        pass_filenames: false
